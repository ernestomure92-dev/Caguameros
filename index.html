<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caguameros — Pagos de Temporada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0d10; --bg-card:#14171c; --bg-card-2:#1b1f26; --line:#2a2f38;
    --blue:#3f6c94; --blue-bright:#5b8fc0; --steel:#8fb3d9;
    --cream:#e8eaed; --cream-dim:#8b929c;
    --green:#4a7a63; --green-dim:#31473b;
    --red:#8a4a48; --red-dim:#4d2e2d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, #1b1f26 0%, transparent 45%),
      radial-gradient(circle at 90% 10%, #161a20 0%, transparent 40%),
      var(--bg);
    color:var(--cream); font-family:'Work Sans', sans-serif;
    padding:28px 16px 80px;
  }
  .wrap{max-width:960px; margin:0 auto;}
  header{display:flex; align-items:center; gap:18px; margin-bottom:26px; flex-wrap:wrap;}
  .crest{flex-shrink:0;}
  h1{
    font-family:'Anton', sans-serif; font-weight:400;
    font-size:clamp(28px,6vw,44px); letter-spacing:1px; margin:0;
    color:var(--steel); line-height:1;
  }
  .subtitle{font-size:12px; letter-spacing:3px; text-transform:uppercase; color:var(--cream-dim); margin-top:6px;}

  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:26px;}
  .stat{background:var(--bg-card); border:1px solid var(--line); border-radius:10px; padding:16px 16px 14px;}
  .stat .label{font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--cream-dim); margin-bottom:6px;}
  .stat .value{font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:24px; color:var(--steel);}
  .stat.paid .value{color:var(--green);}
  .stat.due .value{color:var(--red);}

  section{background:var(--bg-card); border:1px solid var(--line); border-radius:12px; padding:18px 18px 20px; margin-bottom:18px;}
  section h2{
    font-family:'Anton', sans-serif; font-weight:400; font-size:18px; letter-spacing:1px;
    color:var(--blue-bright); margin:0 0 14px; text-transform:uppercase;
  }

  .empty-state{text-align:center; padding:30px 10px; color:var(--cream-dim); font-size:14px;}

  .player-card{background:var(--bg-card-2); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:12px;}
  .player-top{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px;}
  .jersey{
    font-family:'Anton', sans-serif; background:var(--bg); border:2px solid var(--steel); color:var(--steel);
    width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:15px; flex-shrink:0;
  }
  .player-name{font-weight:700; font-size:16px; color:var(--cream);}
  .status-pill{
    margin-left:auto; font-size:11px; font-weight:700; letter-spacing:.5px;
    padding:5px 10px; border-radius:20px; text-transform:uppercase;
  }
  .status-pill.pagado{background:var(--green-dim); color:#c3e0d4;}
  .status-pill.parcial{background:#3a4a5c; color:var(--steel);}
  .status-pill.pendiente{background:var(--red-dim); color:#e3bcba;}

  .player-money{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; border-top:1px solid var(--line); padding-top:12px;}
  .money-box .label{font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--cream-dim); margin-bottom:4px;}
  .money-box .value{font-family:'IBM Plex Mono', monospace; font-size:15px; color:var(--cream);}
  .money-box .value.due{color:var(--red);}

  footer{text-align:center; color:var(--cream-dim); font-size:12px; margin-top:20px; line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="crest" width="64" height="64" viewBox="0 0 64 64" fill="none">
      <circle cx="32" cy="32" r="30" fill="#0b0d10" stroke="#8fb3d9" stroke-width="2"/>
      <circle cx="32" cy="32" r="30" fill="none" stroke="#3f6c94" stroke-width="2" stroke-dasharray="2 4.3"/>
      <path d="M32 14 L44 40 L20 40 Z" fill="#3f6c94" opacity="0.85"/>
      <text x="32" y="37" font-family="Anton, sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">CG</text>
    </svg>
    <div>
      <h1 id="teamNameHeading">Caguameros</h1>
      <div class="subtitle">Pagos de Temporada</div>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><div class="label">Costo de temporada</div><div class="value" id="statCostoTotal">$0</div></div>
    <div class="stat"><div class="label">Cuota por jugador</div><div class="value" id="statCuota">$0</div></div>
    <div class="stat paid"><div class="label">Recaudado</div><div class="value" id="statRecaudado">$0</div></div>
    <div class="stat due"><div class="label">Pendiente</div><div class="value" id="statPendiente">$0</div></div>
    <div class="stat"><div class="label">Al corriente</div><div class="value" id="statAlCorriente">0/0</div></div>
  </div>

  <section>
    <h2>Roster</h2>
    <div id="rosterList"><div class="empty-state">Cargando datos...</div></div>
  </section>

  <footer>Que chinge a su madre el BOMBERO y su sobrino también.</footer>
</div>

<script>
function fmt(currency, n){
  return (currency || '$') + Number(n||0).toLocaleString('es-MX', {maximumFractionDigits:0});
}
function autoFeePerPlayer(state){
  const count = state.players.length;
  return count > 0 ? state.seasonCost / count : 0;
}
function playerFee(state, p){
  return (p.fee !== null && p.fee !== undefined && p.fee !== '') ? Number(p.fee) : autoFeePerPlayer(state);
}
function playerPaid(p){ return Number(p.paidAmount || 0); }
function playerBalance(state, p){ return Math.max(playerFee(state, p) - playerPaid(p), 0); }
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str ?? '';
  return d.innerHTML;
}

function render(state){
  document.getElementById('teamNameHeading').textContent = state.teamName || 'Caguameros';

  const container = document.getElementById('rosterList');
  container.innerHTML = '';

  if(!state.players || state.players.length === 0){
    container.innerHTML = `<div class="empty-state">Aún no hay jugadores registrados.</div>`;
  }else{
    state.players.forEach(p => {
      const fee = playerFee(state, p);
      const paid = playerPaid(p);
      const balance = playerBalance(state, p);
      let statusClass = 'pendiente', statusText = 'Pendiente';
      if(balance <= 0 && fee > 0){ statusClass = 'pagado'; statusText = 'Pagado'; }
      else if(paid > 0){ statusClass = 'parcial'; statusText = 'Parcial'; }

      const card = document.createElement('div');
      card.className = 'player-card';
      card.innerHTML = `
        <div class="player-top">
          <div class="jersey">${p.number ?? '–'}</div>
          <div class="player-name">${escapeHtml(p.name)}</div>
          <div class="status-pill ${statusClass}">${statusText}</div>
        </div>
        <div class="player-money">
          <div class="money-box"><div class="label">Cuota</div><div class="value">${fmt(state.currency, fee)}</div></div>
          <div class="money-box"><div class="label">Pagado</div><div class="value">${fmt(state.currency, paid)}</div></div>
          <div class="money-box"><div class="label">Saldo</div><div class="value due">${fmt(state.currency, balance)}</div></div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  let recaudado = 0, totalDue = 0, alCorriente = 0;
  state.players.forEach(p => {
    const fee = playerFee(state, p);
    recaudado += Math.min(playerPaid(p), fee);
    totalDue += fee;
    if(playerBalance(state, p) <= 0 && fee > 0) alCorriente++;
  });
  document.getElementById('statCostoTotal').textContent = fmt(state.currency, state.seasonCost);
  document.getElementById('statCuota').textContent = fmt(state.currency, autoFeePerPlayer(state));
  document.getElementById('statRecaudado').textContent = fmt(state.currency, recaudado);
  document.getElementById('statPendiente').textContent = fmt(state.currency, totalDue - recaudado);
  document.getElementById('statAlCorriente').textContent = `${alCorriente}/${state.players.length}`;
}

fetch('./data.json', {cache: 'no-store'})
  .then(res => {
    if(!res.ok) throw new Error('No se encontró data.json');
    return res.json();
  })
  .then(render)
  .catch(err => {
    document.getElementById('rosterList').innerHTML =
      `<div class="empty-state">No se pudo cargar data.json (${escapeHtml(err.message)}). Asegúrate de que esté en la misma carpeta que este archivo.</div>`;
  });
</script>
</body>
</html>
